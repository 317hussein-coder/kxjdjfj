plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'com.mymediasee.nativeplayer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mymediasee.nativeplayer'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++20' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
