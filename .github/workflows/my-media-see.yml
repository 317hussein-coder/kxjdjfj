name: Build MY MEDIA SEE APK
on:
  push:
    branches: [ main ]
    paths:
      - 'my-media-see/**'
      - '.github/workflows/my-media-see.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          cd my-media-see
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MY-MEDIA-SEE-debug-apk
          path: my-media-see/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
